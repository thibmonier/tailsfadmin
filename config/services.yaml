services:
    # Service principal — informations du bundle
    Tailsfadmin\Info\BundleInfo:
        public: true

    tailsfadmin.bundle_info:
        alias: Tailsfadmin\Info\BundleInfo
        public: true

    # Service MenuBuilder — construit la structure de menu depuis la configuration.
    # Le checker de sécurité est injecté s'il existe (security-bundle installé) :
    # sinon null → aucun filtrage par permission (rétro-compatible).
    Tailsfadmin\Menu\MenuBuilder:
        arguments:
            - '%tailsfadmin.menu%'
            - '@?security.authorization_checker'
        public: true

    tailsfadmin.menu_builder:
        alias: Tailsfadmin\Menu\MenuBuilder
        public: true

    # Extension Twig — is_active() + tsf_icon() + tsf_dir()
    Tailsfadmin\Twig\TailsfadminExtension:
        arguments:
            - '@request_stack'
            - '%tailsfadmin.rtl_locales%'
            - '%tailsfadmin.locales%'
        tags:
            - { name: twig.extension }

    # i18n (US-024) — résout la locale de session à chaque requête (whitelist)
    Tailsfadmin\EventSubscriber\LocaleSubscriber:
        arguments:
            - '%tailsfadmin.default_locale%'
            - '%tailsfadmin.locales%'
        tags:
            - { name: kernel.event_subscriber }

    # Composants Twig — autowiring + autoconfiguration
    # Le tag "twig.component" est appliqué automatiquement via #[AsTwigComponent]
    Tailsfadmin\Twig\Components\:
        resource: '../src/Twig/Components/'
        autoconfigure: true
        autowire: true

    # US-027 / ADR-007 — installation des dépendances JS dans l'importmap de l'hôte
    Tailsfadmin\Assets\ImportMapInstallPlanner: ~

    Tailsfadmin\Command\AssetsInstallCommand:
        arguments:
            $configReader: '@asset_mapper.importmap.config_reader'
            $importMapManager: '@asset_mapper.importmap.manager'
            $planner: '@Tailsfadmin\Assets\ImportMapInstallPlanner'
            $manifestPath: '%tailsfadmin.dir%/config/importmap-entries.php'
        tags:
            - { name: console.command }
