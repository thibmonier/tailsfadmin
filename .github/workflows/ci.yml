name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle — PHPStan (max) + cs-fixer + tests + couverture (rapport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5 (pcov)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, opcache
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer (bundle)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-bundle-${{ hashFiles('composer.lock') }}
          restore-keys: composer-bundle-

      - name: Valider composer.json (strict — métadonnées Packagist, lock à jour)
        run: composer validate --strict

      - name: Install (bundle)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (niveau max)
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Tests bundle + couverture (rapport)
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text | tail -20

      # NOTE (US-026) : le seuil bloquant ≥ 80% est un suivi. Le src/ du bundle est
      # couvert principalement par les tests fonctionnels de la démo (job "demo"),
      # pas par les tests unitaires du bundle seuls ; câbler une couverture combinée
      # fiable (path-repo symlinké) reste à faire. La couverture est publiée en artefact.
      - name: Résumé de couverture (rapport, non bloquant)
        if: always()
        run: |
          php -r '
            if (!file_exists("coverage.xml")) { echo "pas de rapport\n"; exit(0); }
            $m = simplexml_load_file("coverage.xml")->project->metrics;
            $t = (int) $m["statements"]; $c = (int) $m["coveredstatements"];
            printf("Couverture (tests unitaires bundle): %s%% (%d/%d)\n", $t ? round($c/$t*100,2) : 0, $c, $t);
          '

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bundle
          path: coverage.xml

  bundle-install-min:
    name: Bundle — installabilité runtime (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, opcache
          coverage: none
          tools: composer:v2

      # Installe les dépendances de RUNTIME uniquement depuis le lock (--no-dev :
      # les packages de dev ne sont ni installés ni vérifiés côté plateforme).
      # C'est ce que voit un consommateur / la recette Flex (`composer require` ne
      # tire jamais le require-dev du bundle). Prouve que le runtime s'installe dès
      # PHP 8.2. La suite PHPUnit 12/13 (≥ 8.3) n'est exercée que par bundle-compat.
      - name: Install runtime (--no-dev)
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

  bundle-compat:
    name: Bundle — compat PHP (install + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, opcache
          coverage: none
          tools: composer:v2

      - name: Install (résolution fraîche)
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Tests bundle
        run: vendor/bin/phpunit

  front-lint:
    name: Front — Biome (contrôleurs Stimulus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Biome check
        run: biome ci assets/controllers/

  demo:
    name: Démo — CSS Tailwind + tests fonctionnels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer (démo)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-demo-${{ hashFiles('demo/composer.lock') }}
          restore-keys: composer-demo-

      - name: Install (démo)
        working-directory: demo
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build CSS (Tailwind v4, binaire standalone)
        working-directory: demo
        run: php bin/console tailwind:build --minify

      - name: Compile AssetMapper
        working-directory: demo
        run: php bin/console asset-map:compile

      - name: Tests fonctionnels (démo)
        working-directory: demo
        run: php bin/phpunit --testsuite "Project Test Suite"

  e2e:
    name: E2E — Panther (montage JS réel + audit axe-core a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, opcache
          coverage: none
          tools: composer:v2

      - name: Setup Chrome + ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Résoudre les binaires Chrome (Linux)
        run: |
          echo "PANTHER_CHROME_BINARY=$(command -v chrome || echo '${{ steps.setup-chrome.outputs.chrome-path }}')" >> "$GITHUB_ENV"
          echo "PANTHER_CHROME_DRIVER_BINARY=$(command -v chromedriver)" >> "$GITHUB_ENV"

      - name: Install (démo)
        working-directory: demo
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build CSS + AssetMapper
        working-directory: demo
        run: |
          php bin/console tailwind:build --minify
          php bin/console asset-map:compile

      - name: Tests E2E (Panther + axe-core)
        working-directory: demo
        env:
          PANTHER_NO_SANDBOX: '1'
          PANTHER_CHROME_ARGUMENTS: '--disable-dev-shm-usage --headless=new --no-sandbox'
        run: php bin/phpunit --testsuite e2e

  integration:
    name: Intégration — app Symfony vierge (consommabilité tierce, US-030)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, opcache
          coverage: none
          tools: composer:v2

      - name: Setup Chrome + ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Résoudre les binaires Chrome (Linux)
        run: |
          echo "PANTHER_CHROME_BINARY=$(command -v chrome || echo '${{ steps.setup-chrome.outputs.chrome-path }}')" >> "$GITHUB_ENV"
          echo "PANTHER_CHROME_DRIVER_BINARY=$(command -v chromedriver)" >> "$GITHUB_ENV"

      # L'app vierge est créée HORS du dépôt (répertoire distinct de demo/).
      # Sans version pinée → dernière Symfony stable (couverte par « ^8.0 » du bundle).
      # La matrice multi-versions (7.3) est un suivi dédié (skeleton courant en 8.x).
      - name: Créer l'app tierce + installer le bundle (archive dist)
        run: bash tests/integration/create-app.sh "$RUNNER_TEMP/host-app"

      - name: Appliquer les étapes d'intégration documentées
        run: bash tests/integration/apply-steps.sh "$RUNNER_TEMP/host-app"

      # Scénario d'ÉCHEC (T-030-04), déterministe : AVANT vendoring, l'importmap
      # de l'hôte ne contient pas apexcharts → une page chart casserait (le
      # préflight guide l'utilisateur en console). Vérifié par grep, pas au
      # navigateur (les contrôleurs eager rendent un test navigateur non fiable).
      - name: Scénario échec — apexcharts absent de l'importmap avant vendoring
        working-directory: ${{ runner.temp }}/host-app
        run: |
          if grep -qi "apexcharts" importmap.php; then
            echo "❌ apexcharts est déjà dans l'importmap avant tailsfadmin:assets:install"
            exit 1
          fi
          echo "✓ apexcharts absent avant vendoring (garde-fou attendu côté navigateur)"

      # Vendoring (US-027) : la commande ajoute et vendore les libs.
      - name: tailsfadmin:assets:install + vérif importmap + build
        working-directory: ${{ runner.temp }}/host-app
        run: |
          php bin/console tailsfadmin:assets:install --no-interaction
          grep -qi "apexcharts" importmap.php || { echo "❌ apexcharts absent après assets:install"; exit 1; }
          echo "✓ apexcharts présent après vendoring"
          php bin/console tailwind:build --minify
          php bin/console asset-map:compile

      # Scénario NOMINAL (T-030-03) : la page admin fonctionne, un composant monte.
      - name: Smoke NOMINAL (Panther — layout admin + Dropdown monté)
        working-directory: ${{ runner.temp }}/host-app
        env:
          PANTHER_NO_SANDBOX: '1'
          PANTHER_CHROME_ARGUMENTS: '--disable-dev-shm-usage --headless=new --no-sandbox'
        run: php bin/phpunit
