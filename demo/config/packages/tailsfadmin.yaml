# Menu de la démo. Les `label` sont des CLÉS DE TRADUCTION (US-024) résolues via
# |trans dans le composant Sidebar ; catalogues dans demo/translations/messages.*.yaml.
tailsfadmin:
    menu:
        - group: menu.groups.menu
