        - "fix(modal) ✅ BUG a11y trouvé par la revue console d'US-022 : modal_controller accédait à `this.constructor.#FOCUSABLE` (privé statique) → TypeError dans #trapFocus, focus trap KO (la modale s'affichait quand même, donc l'E2E d'US-011 ne l'avait pas vu). Corrigé : sélecteur en constante de module. Garde de régression ajoutée à ModalE2ETest (focus doit être piégé dans le dialog)."
        - "US-023 ✅ Pages auth + utilitaires. Layout auth du bundle (@Tailsfadmin/layout/auth.html.twig, centré 2 colonnes, sans sidebar). AuthController /auth/login + /auth/register (UI de démo, pas d'auth réelle), signin (email/password/remember/social/liens) + signup (prénom/nom/email/password/CGU). PagesController /pages/blank (gabarit héritant du layout admin). Page 404 : override TwigBundle error404.html.twig, testée en prod (debug=false) SANS stack trace. Routes alignées sur le menu (tailsfadmin.yaml)."
        - "feat(button) : prop `block` (w-full) ajoutée à tsf:Ui:Button (US-010) — nécessaire aux CTA pleine largeur des formulaires auth. Défaut false, non-breaking."
        - "US-024 ✅ i18n FR/EN + RTL + sélecteur de langue. symfony/translation installé (démo). Bundle : LocaleSubscriber (session→whitelist, priorité 20), config locales/default_locale/rtl_locales (configure()+params), prepend translations/ path, tsf_dir()+tsf_locales() (Twig ext), catalogues chrome messages.{fr,en,ar}.yaml complets + es/de structure. Chrome (header/sidebar/breadcrumb/skip-link) externalisé en |trans, <html lang dir> dynamique, classes rtl: (chevrons ms-auto, panneaux ltr:/rtl:). Sélecteur de langue dans le header (réutilise tsf:Ui:Dropdown, 5 langues nom natif+drapeau). Démo : LocaleController /locale/{locale} (session, redirect same-origin anti open-redirect), menu en clés menu.* + catalogues démo messages.{fr,en,ar}.yaml."
      qualite_us021_022_023_024: "demo 179/179 (+ LocaleTest 5) · E2E Panther 5/5 · bundle PHPStan max 0 · cs-fixer 0 · revue visuelle FR/EN/AR + RTL + **dark×RTL** OK (sidebar à droite, layout miroir, 0 erreur console) — action dark×RTL reportée des rétros enfin réalisée."
