    assets: AssetMapper + importmap
    ui: Symfony UX (Twig Components, Live Components, Stimulus)
    css: Tailwind CSS v4
  sources:
    # 4 archives TailAdmin fournies à la racine, extraites dans Tools/sources/
    extracted_to: Tools/sources/
    - name: tailadmin-free-tailwind-dashboard-template-main.zip
      type: html-tailwind
      role: source-primaire   # 20+ pages, partials par composant
    - name: tailadmin-laravel-main.zip
      type: laravel-blade
      role: source-secondaire  # composants Blade, MenuHelper, SidebarController, i18n
    - name: free-react-tailwind-admin-dashboard-main.zip
      type: react
      role: reference
    - name: free-nextjs-admin-dashboard-main.zip
      type: nextjs
      role: reference
  decisions:
    interactivite_js: convert-to-stimulus-ux   # Alpine.js -> Stimulus/UX
    livrable: bundle-plus-demo-app
    prefixe_composants: tsf                     # <twig:tsf:Ui:Alert> (validé)
    distribution_css: tailwind-build-cote-hote  # CSS source recompilé (tokens personnalisables), pas de CSS précompilé par défaut
  js_libs_a_integrer:
    - apexcharts
    - fullcalendar
    - flatpickr
    - dropzone
    - jsvectormap
    - swiper

