# Workflow Status - tailsfadmin
project: tailsfadmin
description: >
  Thème admin pour Symfony fortement inspiré de TailAdmin.
  Livrable double : bundle Symfony réutilisable + application de démo.
track: standard
initialized_at: 2026-09-07T00:00:00Z
current_phase: implementation

