      goal_file: "sprints/sprint-006-pages_i18n/sprint-goal.md"
      done:
        - "US-021 ✅ Dashboard e-commerce sur `/` (DashboardController, route nommée `home` = contrat logo sidebar). Assemblage : KPI cards + Badge variation, jauge radialBar (usage direct du contrôleur apexcharts, pas de nouveau composant bundle), tsf:Chart:Bar (ventes) + tsf:Chart:Line area (statistiques), table commandes récentes (Avatar initiales + Badge statut), démographie placeholder (US-019/jsvectormap au backlog). Commit cd1a51a."
