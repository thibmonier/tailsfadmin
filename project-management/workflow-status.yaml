        - "HomeController + home/index + HomeControllerTest supprimés (le dashboard devient la landing `/`). Route conservée sous le nom `home` car la sidebar du bundle lie `path('home')`."
        - "Tooling qualité racine (PHPStan/cs-fixer) ne couvre que le bundle src/tests, PAS demo/ — le contrôleur démo n'est pas analysé statiquement (écrit en style Symfony : final, promu, attributs, typé)."
        - "LEÇON confirmée (S5→S6) : la revue console navigateur attrape ce que les tests DOM ET E2E ratent — le bug focus trap modal était invisible en DOM/visuel et l'E2E ne vérifiait que la visibilité. Toujours lire la console à l'ouverture d'un composant JS."
        - "Gotchas composants réutilisés : (1) tsf:Ui:Button ne rend pas {{ attributes }} → aucun data-*/id ne passe ; utiliser un <button> brut si besoin d'une action Stimulus. (2) _self.macro() ne traverse pas la frontière d'un slot de Twig Component → utiliser {% include %}. (3) SVG passé en prop : :iconStart=\"var\" (bind), jamais iconStart=\"{{ var }}\" (guillemets internes cassent l'attribut)."
    dette_technique_dark_mode:
      severite: "moyenne-haute (visuel dark)"
      constat: "Le thème INVERSE l'échelle de gris sous .dark : gray-800 = #1d2939 (clair) mais devient #d3d8de (sombre-clair) en dark, gray-900 = #101828 → #eaecef. Conséquence : tout `dark:bg-gray-{700,800,900}` utilisé comme FOND rend CLAIR en dark mode."
      impacts:
        - "tsf:Ui:Button variant=secondary (dark:bg-gray-800) : boutons clairs sur fond sombre en dark (confirmé, computed #d3d8de). Touche tous les boutons secondary de l'app en dark (ex. « Modifier » du profil US-022)."
        - "tsf:Ui:Modal panel (dark:bg-gray-900) : panneau probablement clair en dark (à confirmer visuellement)."
        - "Le dashboard paraissait correct car ses cartes utilisent dark:bg-white/[0.03], pas gray-800."
      corrige_dans_us023: "Uniquement le fond du body/wrapper des layouts auth + 404 (mon erreur : dark:bg-gray-900 → dark:bg-gray-dark)."
      recommandation: "Story dédiée : auditer tous les `dark:bg-gray-{700,800,900}` du bundle (composants + layouts) et soit retirer le `dark:` (laisser l'inversion auto), soit passer à des tokens sombres explicites (gray-dark, white/[0.0x]). Ajouter un test/garde visuelle dark pour les boutons secondary et le modal."
    bilan_sprint_6: "Sprint 6 TERMINÉ — 4 US (US-021..024) = 23 pts livrés. + fix(modal) focus trap + feat(button) block. Dette dark-mode gris systémique identifiée (story dédiée recommandée). Reste au backlog : US-019 (jsvectormap, carte démographie)."
    next: "Sprint 6 terminé. Prochaines options : (a) story d'audit dark-mode gris (dette), (b) US-019 carte jsvectormap, (c) Sprint 7 / rétro Sprint 6."

